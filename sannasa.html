<style>
    /* =======================================================================
       1. CORE RESET & ENVIRONMENT MAPPING
       ======================================================================= */
    *, *::before, *::after {
        box-sizing: border-box;
    }

    /* A transparent background here relies on the browser compositing this
       iframe's content straight through to the parent page's own dark canvas
       — but several elements below (.scroll-sticky-scene, the cylinders, the
       overlay) are deliberately promoted to their own GPU layer for smooth
       scroll performance (will-change/transform/backface-visibility). Once a
       layer is GPU-composited this way, browsers commonly give it an OPAQUE
       backing store instead of honoring true transparency — Chromium paints
       it mid-grey, Mobile Safari paints it solid white — so the "empty" scroll
       runway above the still-rolled scroll showed as a flat grey/white slab
       instead of the site's dark background. A real solid color matching the
       parent page's own background for this exact iframe (index.html sets
       the <iframe> itself to the same #030303) sidesteps that compositing
       quirk entirely, on every browser, instead of depending on it. */
    html, body {
        margin: 0;
        padding: 0;
        background-color: #030303;
        font-family: sans-serif;
        color: #fff;
        overflow: hidden;
        touch-action: pan-y;
    }

    .scroll-viewport {
        position: relative;
        width: 100%;
        background-color: #030303;
        padding: 28px 0 0px;
    }

    /* =======================================================================
       2. MASTER STICKY CONTAINER ARCHITECTURE
       ======================================================================= */
    .scroll-sticky-scene {
        position: sticky;
        top: 0px; 
        left: 0; right: 0;
        display: block; 
        pointer-events: none;
        will-change: transform;
        opacity: 1 !important; 
        transform: translateZ(0); 
    }

    .scroll-master-container {
        --paper-h: 740px; 
        position: relative;
        margin: 0 auto; 
        width: 100%;
        max-width: 650px;
        height: calc(var(--paper-h) + 124px); 
        perspective: 1500px; 
        transform-style: preserve-3d;
        pointer-events: none; 
        flex-shrink: 0;
        will-change: transform;
        backface-visibility: hidden;
        box-shadow: none; 
    }

    /* =======================================================================
       3. CYLINDRICAL ROLLS WITH ORGANIC TEXTURING
       ======================================================================= */
    .scroll-cylinder {
        height: 84px;
        z-index: 10;
        border-radius: 42px;
        filter: url('#edge-fray-light');
        background-repeat: repeat;
        /* `filter` is in will-change alongside transform/background-position so the
           browser keeps this layer's already-rasterized (expensive feTurbulence)
           bitmap cached instead of dropping and fully recomputing it after the
           element has been scrolled far off-screen — see the note above
           .scroll-body-wrapper for the full story (that's the layer where this
           was actually visible as a black flash on scroll-back). */
        will-change: transform, background-position, filter;
        backface-visibility: hidden;
    }

    .scroll-cylinder.top {
        position: absolute;
        top: 0; left: -5%; width: 110%;
        background-image: 
            url('#paper-grain'), 
            linear-gradient(to bottom, #331502 0%, #8e5d32 15%, #fcdcab 35%, #8e5d32 65%, #331502 90%, #140700 100%);
        background-blend-mode: multiply;
        box-shadow: 0 15px 30px -5px rgba(0,0,0,0.85), 0 5px 10px -2px rgba(0,0,0,0.95);
        transform: translateZ(0);
    }

    .scroll-cylinder.bottom {
        position: absolute;
        top: 40px; left: -5%; width: 110%; 
        background-image: 
            url('#paper-grain'), 
            linear-gradient(to bottom, #140700 0%, #331502 15%, #fcdcab 50%, #8e5d32 75%, #1a0901 100%);
        background-blend-mode: multiply;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        transform: translate3d(0, 0px, 0); 
    }

    /* =======================================================================
       4. MAIN UNROLLED PARCHMENT BODY
       ======================================================================= */
    .scroll-body-wrapper {
        position: absolute;
        top: 62px; left: 0; width: 100%;
        height: var(--paper-h);
        clip-path: inset(0 0 100% 0);
        filter: url('#edge-fray-heavy');
        /* This carries the heaviest live SVG filter on the whole sannasa
           (feTurbulence numOctaves=5 + feDisplacementMap) and wraps the entire
           parchment body/text. After it sits far outside the viewport for a
           while, browsers reclaim its composited bitmap to save memory; on
           scroll back into view the filter then has to be fully recomputed
           from scratch, which for this cost is visible as the sannasa going
           black (the iframe's own #030303 body showing through) for close to
           a second before it repaints. Listing `filter` in will-change (not
           just clip-path) asks the browser to keep this layer's raster cache
           around instead of evicting it, so the repaint on scroll-back is
           cheap rather than a full recompute. */
        will-change: clip-path, filter;
        transform: translateZ(0);
        backface-visibility: hidden;
    }

    .scroll-flat-paper {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: var(--paper-h);
        background-color: #d6a874;
        clip-path: polygon(
            0% 0%, 100% 0%, 100% 8%, 94% 11%, 98% 13%, 100% 16%, 
            100% 28%, 90% 32%, 97% 37%, 92% 41%, 100% 45%, 
            100% 55%, 88% 60%, 95% 65%, 89% 69%, 100% 74%, 
            100% 83%, 93% 87%, 100% 92%, 100% 100%, 0% 100%, 
            0% 90%, 5% 86%, 0% 82%, 0% 70%, 12% 65%, 4% 60%, 10% 54%, 0% 49%, 
            0% 40%, 8% 35%, 2% 31%, 0% 20%, 6% 16%, 0% 13%
        );
        background-image: 
            url('#paper-grain'),
            radial-gradient(circle at 18% 28%, rgba(54, 23, 2, 0.25) 0%, transparent 22%), 
            radial-gradient(circle at 82% 62%, rgba(54, 23, 2, 0.28) 0%, transparent 28%),  
            linear-gradient(to right, rgba(58, 23, 4, 0.88) 0%, rgba(92, 55, 22, 0.15) 15%, transparent 25%, transparent 75%, rgba(92, 55, 22, 0.15) 85%, rgba(58, 23, 4, 0.88) 100%),
            radial-gradient(circle at center, transparent 20%, rgba(77, 43, 14, 0.8) 100%);
        background-blend-mode: multiply;
        box-shadow: inset 0 0 100px rgba(43, 19, 4, 0.98);
    }

    /* =======================================================================
       5. PROCEDURAL 3D EMBOSSED ROYAL SEAL
       ======================================================================= */
    .embossed-seal {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 240px; height: 240px;
        opacity: 0.28;
        mix-blend-mode: overlay;
        filter: url('#emboss-filter');
        /* Same raster-cache-retention reasoning as .scroll-body-wrapper above:
           this filter (feSpecularLighting + feDiffuseLighting) is expensive
           enough that letting the browser evict and recompute it on scroll-back
           is visible as a delayed repaint. */
        will-change: filter;
    }

    /* =======================================================================
       6. DECORATIVE LAYERS & OVERLAYS
       ======================================================================= */
    .scroll-decorations {
        position: absolute; inset: 40px;
        border: 2px solid rgba(77, 43, 14, 0.4);
        pointer-events: none;
        box-shadow: 0 0 15px rgba(77, 43, 14, 0.2);
    }

    .scroll-instruction {
        position: absolute;
        bottom: 40px; width: 100%;
        font-size: 14px; letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
        pointer-events: none; text-align: center;
        animation: pulse 2.5s infinite ease-in-out;
        transition: opacity .6s ease;
    }
    .scroll-viewport.unrolled .scroll-instruction { opacity: 0; transition-delay: .5s; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

    .decree-overlay {
        position: absolute;
        top: 62px; left: 0; right: 0;
        z-index: 5;
        height: var(--paper-h); 
        clip-path: inset(0 0 100% 0); 
        will-change: clip-path;
        pointer-events: none;
        backface-visibility: hidden;
        transform: translateZ(0);
    }

    .decree-inner {
        width: 100%; height: var(--paper-h);
        /* 🔥 BUG FIX: යට ලී රෝලයෙන් අකුරු කැපීම වැළැක්වීමට Bottom Padding එක 110px දක්වා වැඩි කර ඇත. 
           දැන් "ස්වස්ති සිද්ධම්" යටින් රෝලයට ඉහළින් ආරක්ෂිත ඉඩක් පවතිනු ඇත. 🔥 */
        padding: 58px 66px 110px; 
        display: flex; flex-direction: column; align-items: center; 
        justify-content: flex-start; 
        text-align: center;
        color: #3d1f0b; font-family: 'Abhaya Libre', serif;
        background: radial-gradient(78% 58% at 50% 42%, rgba(247,226,182,0.26) 0%, transparent 62%);
    }

    .dc-sri { font-weight: 800; font-size: 27px; letter-spacing: 0.02em; margin-bottom: 3px; text-shadow: 0 1px 0 rgba(255,240,214,0.5), 0 0 2px rgba(45,22,8,0.4); }
    .dc-rule { display: flex; align-items: center; gap: 8px; color: #a9812f; margin: 2px 0 9px; font-size: 12px; }
    .dc-rule::before, .dc-rule::after { content: ""; height: 1px; width: 52px; background: linear-gradient(90deg, transparent, #a9812f, transparent); }
    .dc-eyebrow { font-family: 'Gemunu Libre', serif; font-size: 14px; letter-spacing: 0.18em; color: #5e3a1f; margin-bottom: 12px; }
    .dc-lineage { font-family: 'Gemunu Libre', serif; font-size: 12.5px; line-height: 1.4; letter-spacing: 0.015em; color: #6f4523; max-width: 31ch; margin: 0 auto; }
    .dc-name { font-family: 'Abhaya Libre', serif; font-weight: 800; font-size: 40px; line-height: 1.1; color: #3d1f0b; margin: 1px 0 2px; text-shadow: 0 1px 0 rgba(255,240,214,0.5), 0 2px 4px rgba(40,18,4,0.26), 0 0 3px rgba(50,24,8,0.3); }
    .dc-conj { font-family: 'Pinyon Script', cursive; font-size: 26px; color: #a9812f; margin: 3px 0; line-height: 1; }

    .dc-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; margin: 13px auto 0; width: 100%; max-width: 100%; box-sizing: border-box; }

<body>

    <svg width="0" height="0" style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="6" result="noise" />
                <feDiffuseLighting in="noise" lightingColor="#ffe7cc" surfaceScale="3.8" result="light">
                    <feDistantLight azimuth="45" elevation="55" />
                </feDiffuseLighting>
                <feComposite operator="arithmetic" k1="1" k2="0" k3="0" k4="0" in="SourceGraphic" in2="light" />

            <filter id="edge-fray-heavy" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
                <feTurbulence type="turbulence" baseFrequency="0.065" numOctaves="5" seed="28" result="tornNoise" />
                <feDisplacementMap in="SourceGraphic" in2="tornNoise" scale="18" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            </filter>

            <filter id="edge-fray-light" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
                <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="3" seed="14" result="tornNoiseLight" />
                <feDisplacementMap in="SourceGraphic" in2="tornNoiseLight" scale="4" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            </filter>

            <filter id="emboss-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur" />
                <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1" specularExponent="16" lighting-color="#ffffff" result="spec">
                    <feDistantLight azimuth="45" elevation="45" />

                <feDiffuseLighting in="blur" surfaceScale="6" diffuseConstant="1" lighting-color="#d1a56f" result="diff">
                    <feDistantLight azimuth="45" elevation="45" />
                </feDiffuseLighting>
                <feBlend in="diff" in2="spec" mode="screen" result="lit" />
                <feComposite in="lit" in2="SourceGraphic" operator="in" />
            </filter>
        </defs>

          body:"මෙම සුවිශේෂී මංගල මොහොත අප සමඟ සැමරීමට ඔබ සැමගේ ගෞරවනීය සහභාගීත්වය සාදරයෙන් අපේක්ෂා කරමු.",
          lDate:"දිනය", lTime:"වේලාව", lVenue:"ස්ථානය",
          date:"2028 ජනවාරි 12 වන බදාදා", time:"පෙ.ව. 9.00 සිට", venue:"එපිටෝම් හෝටලය", city:"කුරුණෑගල",
          poruwa:"පෝරුවේ චාරිත්‍ර සඳහා සුබ මොහොත — පෙ.ව. 09.27ට",
          swasti:"ස්වස්ති සිද්ධම්",
          cue:"සෙමින් පහළට"
        },
        en: {
          sri:"✦", eyebrow:"The Honour of Your Presence is Requested",
          brideParents:"the beloved daughter of Mr. & Mrs.",
          brideName:"Kaushani",
          groomParents:"the beloved son of Mr. & Mrs.",
          groomName:"Gaurawa",
          join:"on the joyous occasion of their marriage,",
          body:"We most warmly and respectfully request the honour of your presence to celebrate this special moment with us.",
          lDate:"Date", lTime:"Time", lVenue:"Venue",
          date:"Wednesday, 12th January 2028", time:"9.00 a.m. onwards", venue:"The Epitome Hotel", city:"Kurunegala",
          poruwa:"The auspicious Poruwa ceremony commences at 9.27 a.m.",
          swasti:"Swasti Siddham",
          cue:"Scroll to unfurl"
        }
      };

      var live = {};
      function lang(){ try{ var x=localStorage.getItem('hs_lang'); return (x==='en'||x==='ta') ? x : 'si'; }catch(_){ return 'si'; } }
      function set(k, v){ var el=document.querySelector('[data-dc="'+k+'"]'); if(el) el.textContent = v; }
      function ov(key){ var l=lang(), sfx=(l==='si'?'Si':l==='ta'?'Ta':'En'), v=live[key+sfx]; return (v!=null && String(v).trim()!=='') ? String(v) : ''; }
      function plain(key){ var v=live[key]; return (v!=null && String(v).trim()!=='') ? String(v) : ''; }

      var lastNeeded = -1, lastWidth = window.innerWidth;
      
      function measureSceneHeight(){
        var inner = document.querySelector('.decree-inner');
        if(!mc || !inner) return 0;

        var prevH = inner.style.height;
        inner.style.height = 'auto';
        var contentHeight = inner.scrollHeight; 
        inner.style.height = prevH;

        var paper = Math.max(500, Math.round(contentHeight)); 
        mc.style.setProperty('--paper-h', paper + 'px');

        return mc.getBoundingClientRect().height;
      }
      window.__measureSceneHeight = measureSceneHeight;

      function fitSannasa(){
        try{
          if(window.__reflowScrollEngine){ window.__reflowScrollEngine(); return; }
          var sceneH = measureSceneHeight();
          var needed = Math.round(28 + sceneH);
          if(vp) vp.style.height = needed + 'px';
          if(needed === lastNeeded) return;
          lastNeeded = needed;
          if(window.parent && window.parent !== window){
            window.parent.postMessage({ __sannasa:'height', h: needed }, '*');
          }
        }catch(_){}
      }

      window.__fitSannasa = fitSannasa;
      function fitSannasaOnResize(){
        if(window.innerWidth === lastWidth) return;  
        lastWidth = window.innerWidth;
        fitSannasa(); 
      }

      function render(){
        var l = lang(), t = C[l] || C['si'];
        try{ document.documentElement.lang = l; }catch(_){}
        set('sri', ov('sri') || t.sri); set('eyebrow', ov('eyebrow') || t.eyebrow); set('conj', '✦');
        function joinFather(fk, pk, fallback){
          var f = String(ov(fk) || plain(fk) || '').trim();
          var ph = String(ov(pk) || fallback || '').trim();
          return f ? (f + ' ' + ph) : ph;
        }
        set('brideParents', joinFather('brideFather','brideParents', t.brideParents));
        set('brideName',    ov('brideName') || plain('brideName') || t.brideName);
        set('groomParents', joinFather('groomFather','groomParents', t.groomParents));
        set('groomName',    ov('groomName') || plain('groomName') || t.groomName);
        set('join', ov('join') || t.join);
        set('body', ov('sannasaBody') || ov('invite') || t.body);
        set('lDate', ov('lDate') || t.lDate); set('lTime', ov('lTime') || t.lTime); set('lVenue', ov('lVenue') || t.lVenue);
        set('vDate', ov('date') || t.date);
        set('vTime', ov('time') || t.time);
        set('vVenue', ov('venue') || plain('venue') || t.venue);
        var cityKey = (lang() === 'si') ? 'venueCity' : (lang() === 'ta' ? 'venueCityTa' : 'venueCityEn');
        set('vCity', ov('city') || plain(cityKey) || t.city);
        set('poruwa', ov('poruwa') || t.poruwa);
        set('swasti', t.swasti);  
        var cue=document.querySelector('.scroll-instruction'); if(cue) cue.textContent = ov('cue') || t.cue;
        try{ fitSannasa(); }catch(_){} 
      }
      
      render();
      fitSannasa(); 
      
      window.addEventListener('load', fitSannasa, { passive:true });
      window.addEventListener('resize', fitSannasaOnResize, { passive:true });
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitSannasa).catch(function(){}); }
      setTimeout(fitSannasa, 300); setTimeout(fitSannasa, 1200);

      setTimeout(function(){
          Promise.all([ import(SDK+"/firebase-app.js"), import(SDK+"/firebase-firestore.js") ]).then(function(m){
            var app = m[0].initializeApp(cfg), db = m[1].getFirestore(app);
            m[1].onSnapshot(m[1].doc(db,"site","content"), function(snap){
              var d = snap.exists() ? (snap.data()||{}) : {};
              live = d || {};
              if (live.dateISO && !live.dateSi && !live.dateEn){
                try{
                  var dt = new Date(live.dateISO);
                  if(!isNaN(dt)){
                    live.dateSi = dt.toLocaleDateString('si-LK',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
                    live.dateEn = dt.toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
                  }
                }catch(_){}
              }
              render();
            }, function(){});
          }).catch(function(){});
      }, 50); 
    })();
    </script>

    <script>
    (function(){
      var vp = document.querySelector('.scroll-viewport');
      var mc = document.getElementById('scrollMaster');
      var scene = document.querySelector('.scroll-sticky-scene');
      var wrapper = document.querySelector('.scroll-body-wrapper');
      var overlay = document.querySelector('.decree-overlay');
      var topCyl = document.querySelector('.scroll-cylinder.top');
      var bottomCyl = document.querySelector('.scroll-cylinder.bottom');
      
      if(!vp || !mc || !scene) return;

      var reduceMotion = false;
      try{ reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){}

      function applyPhysicsFrame(p){ 
        var paperH = parseFloat(mc.style.getPropertyValue('--paper-h')) || 740;
        var ty = p * paperH;
        var invPct = ((1 - p) * 100).toFixed(3);
        var clip = 'inset(0 0 ' + invPct + '% 0)';
        
        if(wrapper) wrapper.style.clipPath = clip;
        if(overlay) overlay.style.clipPath = clip;
        if(bottomCyl) {
            bottomCyl.style.transform = 'translate3d(0, ' + ty + 'px, 0)';
            bottomCyl.style.backgroundPositionY = (p * -320) + 'px';
        }
        if(topCyl) {
            topCyl.style.backgroundPositionY = (p * 320) + 'px';
        }
      }

      var framed = (window !== window.top);
      var sameOriginFrame = false;
      if(framed){
        try{ sameOriginFrame = !!window.frameElement; }catch(_){ sameOriginFrame = false; }
      }

      var lerpSpeed = 0.08;               
      var current = 0, target = 0;
      var extraPx = 650, pinPx = 0, triggerPx = 0;      
      var running = false, rafId = null;
      var parentProgress = 0;             

      if(sameOriginFrame){
        window.addEventListener('message', function(e){
          var d = e && e.data;
          if(!d || d.__sannasa !== 'progress' || typeof d.p !== 'number') return;
          parentProgress = d.p < 0 ? 0 : (d.p > 1 ? 1 : d.p);
          startEngine(); 
        }, { passive: true });
      }

      function outerHeight(){
        try{ if(sameOriginFrame) return window.parent.innerHeight || 700; }catch(_){}
        return window.innerHeight || 700;
      }

      function reflow(){
        try{
          var sceneH = (window.__measureSceneHeight ? window.__measureSceneHeight() : mc.getBoundingClientRect().height);
          var oh = outerHeight();
          
          pinPx = 0; 
          triggerPx = Math.round(oh * 0.95);
          
          var needed;
          if (!framed) {
              extraPx = reduceMotion ? 0 : Math.max(500, Math.round(oh * 1.0)); 
              needed = Math.round(sceneH + extraPx);
              vp.style.height = needed + 'px';
              if(scene) {
                  scene.style.position = 'sticky';
                  scene.style.top = '0px';
              }
          } else {
              extraPx = reduceMotion ? 0 : Math.max(500, Math.round(oh * 0.8)); 
              needed = Math.round(sceneH + 28); 
              vp.style.height = needed + 'px';
              if(scene) {
                  scene.style.position = 'relative'; 
                  scene.style.top = '0px';
              }
          }
          
          if(sameOriginFrame && window.parent && window.parent !== window){
            window.parent.postMessage({ __sannasa:'height', h: needed, pin: 0, extra: extraPx }, '*');
          }
        }catch(_){}
      }
      window.__reflowScrollEngine = reflow;
      reflow();

      function computeTargetProgress(){
        if(reduceMotion) return 1;
        var p = 0;
        
        if (sameOriginFrame && window.frameElement) {
            var rectTop;
            try {
                rectTop = window.frameElement.getBoundingClientRect().top;
            } catch(e) {
                rectTop = vp.getBoundingClientRect().top;
            }
            var scrolledPastTrigger = triggerPx - rectTop; 
            var localProgress = extraPx > 0 ? clampNum(scrolledPastTrigger / extraPx, 0, 1) : 0;
            p = Math.max(localProgress, parentProgress);
        } else {
            var scrolled = window.scrollY || document.documentElement.scrollTop || 0;
            p = extraPx > 0 ? clampNum(scrolled / extraPx, 0, 1) : 0;
        }
        
        return p > 0.96 ? 1 : p;
      }
      
      function clampNum(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }

      function tick(){
        target = computeTargetProgress();
        var diff = target - current;
        
        if(Math.abs(diff) < 0.0004) {
            current = target;
            applyPhysicsFrame(clampNum(current, 0, 1));
            vp.classList.toggle('unrolled', current > 0.92);
            stopEngine(); 
            return;
        }
        
        current += diff * lerpSpeed;
        var progress = clampNum(current, 0, 1);
        
        applyPhysicsFrame(progress); 
        vp.classList.toggle('unrolled', progress > 0.92);
        
        rafId = requestAnimationFrame(tick);
      }

      function startEngine(){
        if(running) return; 
        running = true;
        if(!rafId) rafId = requestAnimationFrame(tick);
      }
      
      function stopEngine(){ 
        running = false; 
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; } 
      }

      if(reduceMotion){
        applyPhysicsFrame(1); vp.classList.add('unrolled');
        return;
      }

      if(!framed){ 
          window.addEventListener('scroll', startEngine, { passive: true });
          startEngine(); 
      } else if('IntersectionObserver' in window) {
        try{
          var io2 = new IntersectionObserver(function(entries){
            for(var i=0;i<entries.length;i++){ entries[i].isIntersecting ? startEngine() : stopEngine(); }
          }, { rootMargin: '800px 0px 800px 0px' });
          io2.observe(vp);
        }catch(_){ startEngine(); }
      } else { 
          startEngine(); 
      }

    })();
    </script>
