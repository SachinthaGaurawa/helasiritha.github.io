<script>
/* Earliest possible point any script on this page can run -- before
   #preloader/#entry/#nav/main even exist in the DOM, let alone paint.
   Confirmed directly, from a screen recording plus a Playwright probe
   sampling computed styles every animation frame: the OTHER hs_gate_state
   check (the entry gateway's own inline script, near the end of <body>)
   runs too late to actually prevent a flash -- browsers can paint content
   progressively as the parser reaches it, well before a later <script>
   tag executes, so #nav/main/#preloader/#entry all sat visible, fully
   unsuppressed, for a real (if brief) window on every load, including a
   RETURNING visitor's, until that later script finally ran. Doing the
   exact same check here instead -- before <body>, before any of those
   elements are ever created -- means the gate-suppressed class (see
   styles.css) is already present on <html> the instant each of them is
   inserted, so the CSS rule applies immediately, with no gap for
   anything to paint into. Kept separate from the entry gateway's own
   script below (which still runs its full ceremony/interactivity setup
   once those elements actually exist) rather than merging the two --
   this one file/one decision stays minimal and has nothing else to do.

   Condition inverted from `=== 'locked'` to `!== 'normal'`, at explicit
   request: admin having disconnected the site, or turned on the
   post-wedding screen, must go DIRECTLY there -- no preloader ("ආයුබෝවන්"),
   no lamp-tap ceremony, not even briefly, for ANY visitor, not only a
   returning one with a matching cached hint. The only way to know that
   for certain before Firestore answers is a hint that positively says
   "normal" (this exact tab confirmed the site live last time); a
   first-time visit (no hint at all) or a stale "locked" hint must both
   default to suppressed now, same as a confirmed-locked one -- there is
   no safe "assume live" default any more. app.js's applySiteState() (the
   only other place that ever touches this class) removes it the instant
   Firestore's forced, guaranteed-fresh read confirms the site is actually
   live -- typically well under a second -- so a genuinely live site still
   reaches its normal ceremony almost immediately; it just no longer
   free-runs on an unconfirmed assumption first. */
try {
  if (localStorage.getItem('hs_gate_state') !== 'normal') {
    document.documentElement.classList.add('gate-suppressed');
  }
} catch (_) {}
</script>

   (no service worker here — a <script type="module"> only ever loads
   once per navigation and can never hot-reload) notices a new deploy
   went out and force-reloads itself, instead of running stale JS forever
   no matter how many fixes ship after it was first opened. */
window.__BUILD_V__ = "2026092503";

         hero, so browsers that would otherwise treat an off-screen iframe's
         own document fetch as low-priority network traffic (queued behind

       exactly as before (the whole point of loading="eager"/
       fetchpriority="high" above); a RETURNING visitor to a site already
       known to be paused never fetches sannasa.html at all. A first-ever
       visit with no hint yet still loads it eagerly here -- app.js's own
       contentPainted-driven reload (see applySiteState()) is what catches
       that gap once Firestore's real answer says otherwise, the same
       safety net it already provides for the rest of the page. */
    (function(){
      var f = document.querySelector('.sannasa-frame');
      if (!f) return;
      try {
        if (localStorage.getItem('hs_gate_state') === 'locked') return;
      } catch (_) {}
      f.src = f.dataset.src;
    })();

<script type="module" src="app.js?v=2026092503" fetchpriority="high"></script>
<script>
/* Entry gateway — standalone, independent of app.js so it can never trap a visitor */
(function(){
  /* Always start at the very top / entry on every load & refresh — no scroll restoration */
  if('scrollRestoration' in history){ try{ history.scrollRestoration='manual'; }catch(_){} }
  window.scrollTo(0,0);
  document.documentElement.classList.add('entry-lock');   /* lock page scroll behind the gateway */
  var e=document.getElementById('entry');
  if(!e){ document.documentElement.classList.remove('entry-lock'); return; }

  /* Visual suppression is now decided entirely by the head script (see its
     own comment): gate-suppressed is already present on <html> before this
     script ever runs, for every case except a hint that positively
     confirms the site was live last time. This script used to ALSO have
     its own copy of that same check here, returning early (skipping
     inert-setting, TX-painting, and -- critically -- binding the lamp's
     click handler) whenever the hint said "locked". That early return is
     gone on purpose: this gate must stay fully wired up and ready to use
     regardless of whatever the hint guessed, because app.js's
     applySiteState() removes gate-suppressed the moment Firestore's real,
     forced-fresh read confirms the site actually IS live -- including the
     case where a returning visitor's stale "locked" hint from a PAST visit
     no longer matches (the admin re-opened the site since). Skipping this
     setup for that case used to leave a visually-revealed but completely
     non-functional entry gate (no click handler ever bound) behind for
     exactly that visitor. Running it unconditionally instead costs nothing
     while the gate is suppressed -- it's just wiring up listeners and
     classes on elements nobody can see yet -- and guarantees the gate
     works the instant it's actually shown, however it got there. */

  /* role=dialog alone doesn't stop a keyboard user from Tabbing straight past
     the gate's own button into the nav/hero/RSVP controls sitting behind it
     (nothing here visually shows through, but the DOM's tab order doesn't
     know that) — and that let a background control's own Enter/Space
     activation ALSO trigger the gate's global keydown handler below,
     dismissing the gate and operating the hidden control in the same
     keypress. `inert` is the standard fix: it removes everything behind the
     gate from the tab order and click/keyboard reach entirely, with no
     custom focus-cycling logic to get wrong or leave someone stuck in (kept
     to a short, explicit list rather than the whole body, so nothing here
     is any more "trapping" than a normal modal). */
  var bg=[document.getElementById('nav'), document.querySelector('main'), document.querySelector('.footer')];
  bg.forEach(function(el){ if(el) el.setAttribute('inert',''); });

  /* Entry text in the visitor's stored language only (Sinhala default) — language purity.
     No `names` field here on purpose, not even now -- see the note beside
     .entry-names above for the full reasoning: this script runs on EVERY
     load, hint or no hint, so a real name living in this TX table would
     just repaint straight back over an empty markup the instant this runs,
     defeating the whole point. Only eyebrow/sub/cta live here -- generic
     wedding-ceremony phrasing, no couple-specific or identifying content,
     so there's nothing to withhold on any of the three regardless of
     whether the site turns out to be paused. */
  var lang='si'; try{ lang = localStorage.getItem('hs_lang') || 'si'; }catch(_){}
  var TX = {
    si:{ eyebrow:'ශුභ මංගලම්', sub:'අපගේ විවාහ මංගල්‍යයට ඔබ සාදරයෙන් ආරාධනා කරමු', cta:'පහන දැල්වීමට ස්පර්ශ කරන්න', waiting:'සූදානම් වෙමින්…' },
    en:{ eyebrow:'The Wedding Of', sub:'We joyfully invite you to celebrate our wedding day', cta:'Tap the lamp to enter', waiting:'Getting everything ready…' },
    ta:{ eyebrow:'திருமண மங்களம்', sub:'எங்கள் திருமண நாளைக் கொண்டாட உங்களை அன்புடன் அழைக்கிறோம்', cta:'விளக்கை ஏற்ற தொடவும்', waiting:'தயாராகி வருகிறது…' }
  };
  var tx = TX[lang] || TX.si;
  if(lang==='en' || lang==='ta'){ try{ document.documentElement.lang=lang; }catch(_){} }
  (function(){
    var eb=e.querySelector('.entry-eyebrow'); if(eb) eb.textContent=tx.eyebrow;
    var sb=e.querySelector('.entry-sub'); if(sb) sb.textContent=tx.sub;
    var ct=e.querySelector('.entry-cta'); if(ct) ct.textContent=tx.cta;
  })();

  var done=false;
  function reveal(){
    if(done){return;} done=true;
    window.scrollTo(0,0);                                  /* the site opens at its very top */
    /* Measure the flame's ACTUAL on-screen position right now — it sits at
       a different height depending on font scaling, language line count,
       and viewport size, so a fixed guess can't track it. Written as custom
       properties before .go is added, so the flash (styles.css) paints its
       very first frame already anchored to the real flame, not a generic
       screen-center guess. */
    try{
      var flame=e.querySelector('.lamp-flame');
      if(flame){
        var r=flame.getBoundingClientRect();
        document.documentElement.style.setProperty('--flash-x', ((r.left+r.width/2)/window.innerWidth*100)+'%');
        document.documentElement.style.setProperty('--flash-y', ((r.top+r.height/2)/window.innerHeight*100)+'%');
      }
    }catch(_){}
    e.classList.add('go');
    document.documentElement.classList.remove('entry-lock'); /* unlocks page scroll */
    var p=document.getElementById('preloader'); if(p){ p.classList.add('gone'); }
    setTimeout(function(){
      /* Un-inerting nav/main/footer here (not synchronously at tap time,
         where it originally sat right next to entry-lock's removal) —
         these are the ENTIRE page's three top-level subtrees, and removing
         `inert` from all three forces the browser to redo accessibility-tree
         and focusability bookkeeping for everything under them in one go.
         Done at the exact instant the gate's opacity/transform transition
         is trying to render its first frame, that synchronous cost was
         real main-thread contention capable of stalling the transition
         entirely on a real phone — the fade never visibly plays at all,
         just a hard cut from gate to hero (confirmed by frame-by-frame
         video: opacity holds at 1 for several frames, then jumps straight
         to the hero with nothing in between). The gate's `pointer-events:
         none` (added the moment .go is applied, see styles.css) already
         makes the background untouchable for the whole fade regardless of
         `inert`, and the gate is still substantially covering the screen
         throughout that fade — so nothing needs `inert` lifted before this
         point, where it's not fighting the transition for the main thread. */
      bg.forEach(function(el){ if(el) el.removeAttribute('inert'); });
      if(e&&e.parentNode){ e.parentNode.removeChild(e); }
      /* 'entered' no longer drives any animation on body (see the note in
         styles.css where pageIn used to be) — everything underneath #entry
         was already fully rendered and visible the whole time it was
         covered, so removing it here is the entire reveal; there's nothing
         left to ease in afterward, and a post-hoc opacity animation only
         ever produced a visible dimming jolt of already-shown content.
         Kept for any future CSS/JS that wants to key off "past the gate". */
      document.documentElement.classList.add('entered');
    }, 1150); /* matches the staged fade in styles.css (.entry's transform: .05s delay + 1s, the longest of the three) */
  }

  /* Reported directly, with a screen recording: tapping the lamp used to
     call reveal() unconditionally, the instant it was tapped -- with no
     regard for whether app.js's Firestore fetch had actually finished.
     On anything short of an already-warm connection, that meant the hero
     underneath (portrait circle, names, RSVP button -- all empty markup
     until app.js's renderHero() fills them in) got uncovered BLANK, which
     then visibly popped in a moment later once that fetch finally
     resolved. This is that fix: hold the reveal open, with a brief
     honest "getting ready" cue, until app.js itself says the hero is
     actually painted -- window.__hsHeroReady / the "hs:hero-ready" event
     it fires from revealHeroWhenSafe() (app.js). Already-ready (the
     common case -- app.js has had the whole preloader/gate-tap-finding
     time to answer) skips the wait entirely and reveals exactly as
     instantly as before.

     Still fully independent of app.js on purpose (see this script's own
     top-of-file comment: "so it can never trap a visitor") -- the
     6300ms fallback below fires reveal() regardless, even if app.js
     never loads, throws, or Firestore is unreachable. That bound sits
     just past app.js's OWN 6000ms DEFAULTS-render fallback (see its
     init()), so in every case except app.js being entirely gone, this
     fallback is a no-op that never actually gets reached -- the ready
     event already fired first. */
  var tapped=false;
  function attemptEnter(){
    if(tapped){return;} tapped=true;
    if(window.__hsHeroReady){ reveal(); return; }
    var revealed=false;
    function go(){ if(revealed){return;} revealed=true; clearTimeout(cueTimer); clearTimeout(boundTimer); reveal(); }
    /* Only show the "getting ready" cue if the wait is actually long
       enough for a human to notice -- most taps resolve within a couple
       hundred ms (Firestore's forced read has been in flight since page
       load, well before the visitor found and tapped the lamp), and
       flashing a cue on for a couple of frames then instantly off would
       itself read as a glitch, not a fix for one. */
    var cueTimer=setTimeout(function(){
      e.classList.add('waiting');
      var ct=e.querySelector('.entry-cta'); if(ct) ct.textContent=tx.waiting;
    }, 220);
    window.addEventListener('hs:hero-ready', go, {once:true});
    var boundTimer=setTimeout(go, 6300);
  }
  var b=document.getElementById('entryEnter');
  if(b){ b.addEventListener('click', attemptEnter); }
  e.addEventListener('click', function(ev){ if(ev.target===e){ attemptEnter(); } });
  document.addEventListener('keydown', function(ev){
    if(!tapped && (ev.key==='Enter' || ev.key===' ' || ev.key==='Escape')){ attemptEnter(); }
  });
  /* refresh / back-forward cache restore → force top while the gateway is still up */
  window.addEventListener('pageshow', function(){ if(!tapped){ window.scrollTo(0,0); } });
})();
</script>
